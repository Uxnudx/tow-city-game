<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212a">
<title>Город на буксире</title>
<link rel="stylesheet" href="side.css">
<link rel="stylesheet" href="shell.css">
<script defer src="audio.js"></script>
<script defer src="side-model.js"></script>
<script defer src="town-model.js"></script>
<script defer src="town-story.js"></script>
<script defer src="side-art.js"></script>
<script defer src="town-art.js"></script>
<script defer src="side-game.js"></script>
</head>
<body class="game-body" data-view="loading">
<main class="game-world" aria-label="Город на буксире">
  <div class="frame"><canvas id="sea" tabindex="-1" width="1280" height="720" aria-label="Боковой вид бухты"></canvas><canvas id="town" tabindex="-1" width="1280" height="720" aria-label="Свободная прогулка по городу с видом сверху" hidden></canvas></div>
  <div class="game-hud" id="game-hud">
    <div class="hud-top">
      <div class="mission-plate"><h1 id="mission-title">Вечерняя гавань</h1><div class="mission-status"><span id="location">Бухта</span><span id="current">Тихая вода</span></div></div>
      <div class="hud-tools">
        <dl class="stats">
          <div class="gauge"><dt>Монеты</dt><dd><span class="coin-glyph" aria-hidden="true"></span><span id="money">0</span></dd></div>
          <div class="gauge"><dt>Репутация</dt><dd><span class="rank-glyph" aria-hidden="true"></span><span id="rep">0</span></dd></div>
        </dl>
        <button id="hamburger" class="pause-key" aria-label="Пауза" title="Пауза · Esc" aria-haspopup="dialog" aria-controls="panel" aria-expanded="false"><span aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="indicators"><span class="hint" id="prompt" hidden></span><span class="tension" id="tow" hidden>Натяжение <meter id="rope-meter" min="0" max="1" low=".58" high=".8" optimum="0" value="0"></meter></span></div>
      <div class="objective"><div><strong id="goal"></strong><p id="detail"></p></div><button id="disembark" hidden>Сойти на берег</button><button id="retry" hidden>Начать рейс заново</button></div>
      <div class="touch" aria-label="Сенсорное управление"><button data-control="left" aria-label="Влево">←</button><button data-control="brake" class="water-control">Тормоз</button><button data-control="up" class="land-control" aria-label="Вверх">↑</button><button data-control="down" class="land-control" aria-label="Вниз">↓</button><button data-control="right" aria-label="Вправо">→</button><button id="touch-hook" class="water-control">Трос</button><button id="touch-action">Действие</button></div>
      <div class="key-map"><span class="water-control"><kbd>A</kbd> <kbd>D</kbd> ход</span><span class="water-control"><kbd>W</kbd> тормоз</span><span class="water-control"><kbd>Пробел</kbd> трос</span><span class="land-control"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> идти</span><span><kbd>E</kbd> действие</span></div>
    </div>
  </div>
</main>
<div class="loading-screen" id="loading-screen"><div role="status" aria-live="polite" class="loading-status"><strong>Город на буксире</strong><span id="loading-caption">Поднимаем портовую смену…</span><progress id="loading-progress" max="11" value="0" aria-label="Загрузка игры"></progress></div></div>
<div class="dialog" id="panel" hidden><section role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="tag" id="panel-tag"></div><h2 id="panel-title"></h2><div id="panel-body"></div><button id="panel-close">Вернуться в бухту</button></section></div>
<noscript><p class="graphics-unavailable">Включите JavaScript, чтобы запустить игру.</p></noscript>
</body>
</html>
